# Half-ring (a): JSD understanding distill on mixed nav+VS L0 audit-pass VTs.
# VISUAL_OPSD_DATA_ROOT must point at data/audit_pass_nav_vs_l0_trainonly.
# Does not overwrite nav-only or VS-only audit-pass trees.
visual_opsd:
  dataset_names:
  - Spatial_Navigation
  - Visual_Search
  image_transform_args:
    image_stride: 14
    max_image_size: 980
    min_image_size: 378
    max_pixels: 2_007_040
  is_mandatory: true
  num_used_data:
  - 100000
  - 100000
  weight: 1
